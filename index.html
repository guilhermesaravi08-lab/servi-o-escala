<!-- Carregamento do SDK do Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  // 1. Cole aqui a configuração fornecida pelo seu painel do Firebase
  const firebaseConfig = {
    apiKey: "SUA_API_KEY_AQUI",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "123456789",
    appId: "1:123456789:web:abcdef"
  };

  // Inicializa o Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let efetivo = [];
  const diasSemana = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SAB'];
  const mesesNome = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];

  function notificarSalvamento(texto = '💾 Salvação concluída!') {
    const status = document.getElementById('saveStatus');
    status.innerText = texto;
    setTimeout(() => {
      status.innerText = '☁️ Conectado e sincronizado em tempo real';
    }, 2000);
  }

  // --- GESTÃO DO EFETIVO NA NUVEM ---
  database.ref('efetivo').on('value', (snapshot) => {
    efetivo = snapshot.val() || ['Cb Silva', 'Sd Oliveira', 'Sd Santos', 'Sd Costa'];
    renderizarEfetivo();
    carregarEscala();
  });

  function salvarEfetivoNuvem() {
    database.ref('efetivo').set(efetivo);
    notificarSalvamento();
  }

  function adicionarMilitar() {
    const input = document.getElementById('novoMilitar');
    const nome = input.value.trim();
    if (nome) {
      efetivo.push(nome);
      input.value = '';
      salvarEfetivoNuvem();
    }
  }

  function removerMilitar(index) {
    efetivo.splice(index, 1);
    salvarEfetivoNuvem();
  }

  function renderizarEfetivo() {
    const container = document.getElementById('listaMilitares');
    container.innerHTML = '';
    efetivo.forEach((militar, idx) => {
      container.innerHTML += `
        <div class="militar-tag">
          ${militar}
          <span onclick="removerMilitar(${idx})">&times;</span>
        </div>
      `;
    });
  }

  function getOptionsHtml(selecionado = '') {
    let options = '<option value="">-- Selecione --</option>';
    efetivo.forEach(m => {
      const selectedAttr = m === selecionado ? 'selected' : '';
      options += `<option value="${m}" ${selectedAttr}>${m}</option>`;
    });
    return options;
  }

  function getChaveMes() {
    const mes = document.getElementById('mes').value;
    const ano = document.getElementById('ano').value;
    return `escala_${ano}_${mes}`;
  }

  // --- SALVAMENTO E SINCRONIZAÇÃO DA ESCALA ---
  function salvarDadosTabela() {
    const chave = getChaveMes();
    const linhas = document.querySelectorAll('#corpoTabela tr');
    const dadosEscala = [];

    linhas.forEach(row => {
      const plantao = [
        row.querySelector('.plantao-1').value,
        row.querySelector('.plantao-2').value,
        row.querySelector('.plantao-3').value
      ];
      const eqA = [
        row.querySelector('.eqa-1').value,
        row.querySelector('.eqa-2').value,
        row.querySelector('.eqa-3').value
      ];
      const eqB = [
        row.querySelector('.eqb-1').value,
        row.querySelector('.eqb-2').value,
        row.querySelector('.eqb-3').value
      ];
      const obs = row.querySelector('.input-obs').value;

      dadosEscala.push({ plantao, eqA, eqB, obs });
    });

    // Envia os dados atualizados para a nuvem
    database.ref('escalas/' + chave).set(dadosEscala);
    notificarSalvamento('☁️ Alteração salva na nuvem!');
  }

  function carregarEscala() {
    const mes = parseInt(document.getElementById('mes').value);
    const ano = parseInt(document.getElementById('ano').value);
    
    document.getElementById('tituloMes').innerText = `${mesesNome[mes]} ${ano}`;

    const totalDias = new Date(ano, mes + 1, 0).getDate();
    const chave = getChaveMes();

    // Escuta alterações em tempo real do mês selecionado
    database.ref('escalas/' + chave).off(); // Remove ouvinte anterior
    database.ref('escalas/' + chave).on('value', (snapshot) => {
      const dadosSalvos = snapshot.val() || [];
      const corpo = document.getElementById('corpoTabela');
      corpo.innerHTML = '';

      for (let dia = 1; dia <= totalDias; dia++) {
        const dataObj = new Date(ano, mes, dia);
        const diaSemanaTexto = diasSemana[dataObj.getDay()];
        const isEvenRow = dia % 2 === 0;
        const rowClass = isEvenRow ? 'row-odd' : 'row-even';
        const diaSalvo = dadosSalvos[dia - 1] || { plantao: ['', '', ''], eqA: ['', '', ''], eqB: ['', '', ''], obs: '' };

        const tr = document.createElement('tr');
        tr.className = rowClass;

        tr.innerHTML = `
          <td><strong>${dia}.</strong></td>
          <td><strong>${diaSemanaTexto}</strong></td>
          <td>
            <div class="cell-group">
              <select class="plantao-1" onchange="salvarDadosTabela()">${getOptionsHtml(diaSalvo.plantao ? diaSalvo.plantao[0] : '')}</select>
              <select class="plantao-2" onchange="salvarDadosTabela()">${getOptionsHtml(diaSalvo.plantao ? diaSalvo.plantao[1] : '')}</select>
              <select class="plantao-3" onchange="salvarDadosTabela()">${getOptionsHtml(diaSalvo.plantao ? diaSalvo.plantao[2] : '')}</select>
            </div>
          </td>
          <td class="eq-a">
            <div class="cell-group">
              <select class="eqa-1" onchange="salvarDadosTabela()">${getOptionsHtml(diaSalvo.eqA ? diaSalvo.eqA[0] : '')}</select>
              <select class="eqa-2" onchange="salvarDadosTabela()">${getOptionsHtml(diaSalvo.eqA ? diaSalvo.eqA[1] : '')}</select>
              <select class="eqa-3" onchange="salvarDadosTabela()">${getOptionsHtml(diaSalvo.eqA ? diaSalvo.eqA[2] : '')}</select>
            </div>
          </td>
          <td class="eq-b">
            <div class="cell-group">
              <select class="eqb-1" onchange="salvarDadosTabela()">${getOptionsHtml(diaSalvo.eqB ? diaSalvo.eqB[0] : '')}</select>
              <select class="eqb-2" onchange="salvarDadosTabela()">${getOptionsHtml(diaSalvo.eqB ? diaSalvo.eqB[1] : '')}</select>
              <select class="eqb-3" onchange="salvarDadosTabela()">${getOptionsHtml(diaSalvo.eqB ? diaSalvo.eqB[2] : '')}</select>
            </div>
          </td>
          <td>
            <input type="text" class="input-obs" value="${diaSalvo.obs || ''}" placeholder="..." oninput="salvarDadosTabela()">
          </td>
        `;

        corpo.appendChild(tr);
      }
    });
  }

  function preencherEscalaAutomática() {
    if (efetivo.length < 4) {
      alert("Cadastre pelo menos 4 militares no efetivo!");
      return;
    }

    const linhas = document.querySelectorAll('#corpoTabela tr');
    linhas.forEach((row, index) => {
      const p1 = row.querySelector('.plantao-1');
      const militarIndex = index % 4;
      if (efetivo[militarIndex]) {
        p1.value = efetivo[militarIndex];
      }
    });

    salvarDadosTabela();
  }
</script>
